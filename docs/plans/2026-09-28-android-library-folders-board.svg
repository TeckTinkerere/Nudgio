<title id="title">Nudgio Android Library: two-level folder concept</title>
<desc id="desc">Four static phone wireframes show Library folders, Learning with subfolders, scoped search results, and a Move here destination sheet. Ink blue, apricot and ivory palette. Synthetic examples, not implemented screens.</desc>
