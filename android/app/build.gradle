apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Room's annotation processor. KSP, not kapt: kapt is in maintenance mode
// and noticeably slower; Room has shipped first-class KSP support since 2.5.
apply plugin: "com.google.devtools.ksp"

/**
 * Build variants (MR-07 "Build variants"):
 *  - debug:   developer tools, synthetic event injector, verbose local log;
 *  - qa:      release-like signing, test fixtures, controlled diagnostics;
 *  - release: no debug menus, no Internet permission, minified.
 *
 * versionCode/versionName (ADR-019) are stamped by `scripts/release/stamp-version.js`
 * (MR-20) into `../version.properties`, not hand-edited here — see that
 * file's own header comment for why versionCode must only ever increase.
 *
 * Signing: MR-18 "Release commands are scripted and never request signing
 * secrets from source-controlled files." `RELEASE_STORE_FILE`/
 * `RELEASE_STORE_PASSWORD`/`RELEASE_KEY_ALIAS`/`RELEASE_KEY_PASSWORD`
 * environment variables (CI, MR-20 "CI signing uses protected secret storage")
 * take priority; `../keystore.properties` (gitignored, MR-20 "local/offline
 * signing is acceptable for early releases") is the fallback. Neither is
 * committed. With neither present, `release`/`qa` build unsigned — the
 * pre-existing behavior before this file's signing block existed.
 */
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}

def releaseSigningEnvVars = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
def hasReleaseSigningEnv = releaseSigningEnvVars.every { System.getenv(it) != null }
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystorePropsFile = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystorePropsFile) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = hasReleaseSigningEnv || hasKeystorePropsFile

android {
    namespace "com.aslam.mediareminder"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.aslam.mediareminder"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionProps.getProperty('versionCode', '1').toInteger()
        versionName versionProps.getProperty('versionName', '0.1.0')
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                if (hasReleaseSigningEnv) {
                    storeFile file(System.getenv('RELEASE_STORE_FILE'))
                    storePassword System.getenv('RELEASE_STORE_PASSWORD')
                    keyAlias System.getenv('RELEASE_KEY_ALIAS')
                    keyPassword System.getenv('RELEASE_KEY_PASSWORD')
                } else {
                    storeFile file(keystoreProps.getProperty('storeFile'))
                    storePassword keystoreProps.getProperty('storePassword')
                    keyAlias keystoreProps.getProperty('keyAlias')
                    keyPassword keystoreProps.getProperty('keyPassword')
                }
            }
        }
    }

    buildTypes {
        debug {
            // MR-07: developer tools, synthetic event injector, verbose log.
            buildConfigField "String", "BUILD_VARIANT", '"debug"'
        }
        release {
            buildConfigField "String", "BUILD_VARIANT", '"release"'
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // `qa`: release-like signing/optimization with controlled diagnostics and
    // no remote analytics (MR-07). Declared as a build type, not a flavor,
    // because it does not vary applicationId or resources — only behavior
    // flags read from `BuildConfig.BUILD_VARIANT` at runtime
    // (see `core/config/featureFlags.ts` on the JS side, and
    // `bridge/BuildVariant.kt` on this side).
    buildTypes {
        qa {
            initWith release
            buildConfigField "String", "BUILD_VARIANT", '"qa"'
            matchingFallbacks = ["release"]
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        // ADR-015: no automatic cloud backup of app data. `dataExtractionRules`
        // (API 31+) and `fullBackupContent` (legacy) both live in
        // src/main/res/xml and are wired below; this block only trims
        // duplicate native libs pulled in by transitive dependencies.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

react {
    // Standard React Native New Architecture autolinking; no per-project
    // overrides needed yet. `autolinkLibrariesWithApp()` reads
    // build/generated/autolinking/autolinking.json and adds the actual
    // `implementation project(...)` dependencies (react-native-gesture-handler,
    // react-native-screens, etc.) to :app — required (RN Gradle plugin's own
    // doc comment on `ReactExtension.autolinkLibrariesWithApp()`: "necessary
    // for libraries to be linked correctly"), not automatic. Without it,
    // `settings.gradle`'s `autolinkLibrariesFromCommand()` only makes these
    // modules includeable as Gradle subprojects — it does not make :app
    // depend on them, so `PackageList.java` (which does get generated
    // correctly either way) fails to compile with "package does not exist"
    // for every autolinked native module.
    autolinkLibrariesWithApp()
}

/**
 * Room schema export location.
 *
 * `MediaReminderDatabase` has always declared `exportSchema = true`, but without
 * this argument Room silently writes nothing, so the exported schemas the
 * annotation promises did not exist. That matters beyond tidiness: the exported
 * JSON is the reference used to check that a hand-written `Migration` produces
 * exactly the schema Room expects. Without it a migration that is subtly wrong
 * (a missing DEFAULT, an index name that does not match Room's generated one)
 * only fails at runtime, on a real user's existing install, with "Room cannot
 * verify the data integrity" and a database that will not open.
 *
 * MR-09 prohibits destructive migration, so a broken migration has no fallback —
 * this is the check that keeps that promise enforceable. Commit the generated
 * `schemas/` output; it is a reviewed artifact, not build noise.
 */
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // AndroidX baseline the design system and startup snapshot rely on today.
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    // MR-06 presentation slice: `AlarmActivity`'s Material buttons and the
    // `Theme.Material3.*` parent `styles.xml` already declares. Made
    // explicit rather than relying on it arriving transitively through
    // `react-android`.
    implementation("com.google.android.material:material:1.12.0")
    // MR-07: "Theme and lightweight preferences" -> DataStore, not Room.
    implementation("androidx.datastore:datastore-preferences:1.1.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")

    // MR-09: Room is the logical source of truth for reminders/schedules/
    // occurrences (ADR-004). `room-ktx` brings the coroutine `suspend` DAO
    // surface so no `Executor`/callback plumbing is needed.
    implementation("androidx.room:room-runtime:$rootProject.ext.roomVersion")
    implementation("androidx.room:room-ktx:$rootProject.ext.roomVersion")
    ksp("androidx.room:room-compiler:$rootProject.ext.roomVersion")

    // AlarmManager scheduling (this slice) needs no extra AndroidX artifact —
    // it is a platform API. Media3 and the alarm/notification UI (full-screen
    // activity, ringing service, media playback) are a later slice; see
    // docs/decision-log.md for the explicit scope cut.

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0")
    // android.jar's org.json classes are stubs ("Stub!") on the plain JVM
    // unit-test classpath — the backup module's manifest/record codecs use
    // org.json directly, so JVM tests need a real implementation. Test-only
    // (testImplementation), never packaged into the app.
    testImplementation("org.json:json:20240303")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
    androidTestImplementation("androidx.room:room-testing:$rootProject.ext.roomVersion")
}
