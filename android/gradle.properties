# Project-wide Gradle settings.
# R8 (minifyRelease) loads far more classes than the debug pipeline and died
# with OutOfMemoryError: Metaspace at 512m on a full assembleRelease.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true

org.gradle.configureondemand=true

# AndroidX is required; React Native 0.86 targets AndroidX exclusively.
android.useAndroidX=true

# ADR-003 / ADR-019: New Architecture (TurboModules/Fabric) is the baseline —
# the alarm-core TurboModule this app is built around has no legacy-bridge path.
newArchEnabled=true

# Hermes is the default RN JS engine; no legacy JavaScriptCore fallback is
# configured for this app.
hermesEnabled=true

# Reserved for a future arch-specific split; unset builds a universal APK,
# which the release pipeline (MR-20) may narrow per-ABI at packaging time.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
