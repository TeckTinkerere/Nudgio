# Project-wide Gradle settings.
# R8 (minifyRelease) loads far more classes than the debug pipeline and died
# with OutOfMemoryError: Metaspace at 512m on a full assembleRelease.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true

org.gradle.configureondemand=true

# AndroidX is required by the Kotlin core and the Flutter embedding.
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Disable Java toolchain auto-detection and downloading to avoid network issues
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.fromEnv=JAVA_HOME
