pluginManagement { includeBuild(new File(['node', '--print', "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim()).getParentFile().toString()) }

plugins { id("com.facebook.react.settings") }

def reactNativeGradlePlugin = new File(['node', '--print', "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim()).getParentFile().toString()

rootProject.name = 'Nudgio'

// Configures autolinking for React Native dependencies declared in package.json.
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }

include ':app'

// Substitutes the com.facebook.react:react-native-gradle-plugin classpath
// dependency (declared without a version in build.gradle) with this local
// build, so it doesn't try to resolve from a remote Maven repo.
includeBuild(reactNativeGradlePlugin)
