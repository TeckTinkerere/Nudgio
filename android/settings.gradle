/*
 * Flutter host (ADR-023, phase F2). The Flutter Gradle plugin is loaded from
 * the SDK named in local.properties (`flutter.sdk`), which `flutter pub get`,
 * `flutter build` and `flutter run` write automatically, on CI too.
 *
 * Versions are the minimums the Flutter 3.47 Gradle plugin accepts (DL-121):
 * AGP 8.11.1 (was 8.10.0, DL-044) and Kotlin 2.2.20 (was 2.1.20) with its
 * matching KSP for Room. Room, AndroidX and the Kotlin core are unchanged.
 */
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null, "flutter.sdk not set in local.properties: run `flutter pub get` at the repository root"
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.google.devtools.ksp" version "2.2.20-2.0.4" apply false
}

rootProject.name = 'Nudgio'

include ':app'
