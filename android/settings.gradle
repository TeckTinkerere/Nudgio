/*
 * Flutter host (ADR-023, phase F2). The Flutter Gradle plugin is loaded from
 * the SDK named in local.properties (`flutter.sdk`), which `flutter pub get`,
 * `flutter build` and `flutter run` write automatically, on CI too.
 *
 * Kotlin 2.1.20 and its matching KSP (Room) are what the React Native build
 * used. AGP moves from 8.10.0 (DL-044) to 8.11.1, the minimum the Flutter
 * 3.47 Gradle plugin accepts (DL-121); nothing else about how the Kotlin core
 * is compiled changes.
 */
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null, "flutter.sdk not set in local.properties: run `flutter pub get` at the repository root"
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.20" apply false
    id "com.google.devtools.ksp" version "2.1.20-2.0.1" apply false
}

rootProject.name = 'Nudgio'

include ':app'
