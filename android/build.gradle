/**
 * Root Gradle build file.
 *
 * Versions below are the ADR-019 baseline (minSdk 26 / compileSdk 36 /
 * targetSdk 36). Plugin versions now live in settings.gradle's `plugins`
 * block (Flutter host, ADR-023 phase F2). `compileSdkVersion` was originally
 * pinned to 37, but the first real build against a real Android SDK
 * (docs/decision-log.md DL-041) found no resolvable `android-37` platform
 * target — API 36 (Android 16) is the latest normal stable release. AGP was
 * originally pinned to 8.12.0, but the locally installed Android Studio
 * only supports up to AGP 8.10.0 (DL-044) — downgraded so IDE sync works,
 * not just the command-line `./gradlew`. Confirm the exact Android Gradle
 * Plugin / Kotlin / Gradle wrapper trio against the pinned Flutter SDK
 * (`.fvmrc`) and your actual Android Studio install before
 * bumping either again — MR-18 requires current platform facts to be
 * refreshed from MR-22, not assumed from this file.
 */
buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        roomVersion = "2.7.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

/*
 * The Flutter tool looks for build outputs under the repository's `build/`
 * directory (`build/app/outputs/flutter-apk/`), so every module builds there,
 * exactly as the Flutter template sets up. CI's release-manifest check reads
 * `build/app/intermediates/...` accordingly.
 */
def flutterBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(flutterBuildDir)

subprojects {
    project.layout.buildDirectory.value(flutterBuildDir.dir(project.name))
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
