version: 2

# What Dependabot must NOT touch, and why. Each of these is pinned in lockstep
# with React Native (0.86 today) and breaks the build when bumped alone; the
# first run opened PRs for them and every one failed CI. They move together,
# deliberately, with a React Native upgrade (see android/build.gradle, ADR-019)
# or are removed by the Flutter migration (ADR-023), not as automatic bumps.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the exact versions React Native 0.86 renders with.
      - dependency-name: react
      - dependency-name: react-test-renderer
      - dependency-name: react-native
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-community/*'
      # A matched pair: Reanimated 4.7 needs Worklets 0.13 while this app is on
      # 0.11, and a lone Reanimated bump crashed 14 Jest suites. They move
      # together, with the React Native upgrade.
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      # The Babel/Jest/TypeScript/testing toolchain is wired to RN's presets.
      # Majors (Babel 8, testing-library 14, gesture-handler 3, ...) fail
      # `npm ci` or the type check against RN 0.86.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Kotlin/KSP/AGP/Gradle toolchain is chosen to match React Native's
      # Gradle plugin. Moving Kotlin to 2.4 or Gradle to 9.8 broke compilation.
      - dependency-name: org.jetbrains.kotlin*
      - dependency-name: com.google.devtools.ksp*
      - dependency-name: com.android.tools.build*
      - dependency-name: com.facebook.react*
      # Dependabot names the wrapper `gradle-wrapper`; `gradle` matches nothing.
      - dependency-name: gradle-wrapper
      # Room's compiler runs through KSP, so it moves with the toolchain.
      - dependency-name: androidx.room*
      # These raise the required compileSdk and Android Gradle Plugin with
      # each release (core 1.19 needs compileSdk 37 and AGP 9.1; the project is
      # on 36 and 8.10, ADR-019), so they move with a deliberate SDK baseline
      # bump, not as a minor version.
      - dependency-name: androidx.core*
      - dependency-name: androidx.appcompat*
      - dependency-name: com.google.android.material*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
